<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <script src="aula24pt2.js" defer></script>
    <style>
        button{
            margin: 20px;
            padding: 10px 20px;
            cursor: pointer; /* transforma o cursor em uma mão quando o usuário passa o mouse sobre o botão */
        }
        input{
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Escolha a cor de fundo ou interaja de outras formas</h1>
    <button id="redButton">Vermelho</button>
    <button id="blueButton">Azul</button>
    <button id="greenButton">Verde</button>
    <input type="text" id="inputBox" placeholder="pressione uma tecla" size="20">

</body>
</html>
