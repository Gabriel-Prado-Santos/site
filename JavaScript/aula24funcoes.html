<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções e Eventos</title>
    <script src="aula24.js" defer></script>
    <style>
        label, button{
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
  <h1>Saudação</h1>
  <label for="nome">Digite seu nome:</label>
  <input type="text" id="nome" name="nome">
  <label for="horario">Que horas são? </label>
  <select id="horario">
    <option value=""></option>
    <option value="8">Manhã 8h</option>
    <option value="14">Tarde 14h</option>
    <option value="20">Noite 20h</option>
  </select>  
  <button onclick="saudacao()">Saudar</button>
  <p id="mensagem"></p>
</body>
</html>
